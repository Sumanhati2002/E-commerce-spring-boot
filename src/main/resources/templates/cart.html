
<!doctype html>
<html lang="en" xmlns:th="https://thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="author" content="Untree.co">
<link rel="shortcut icon" href="favicon.png">

<meta name="description" content="" />
<meta name="keywords" content="bootstrap, bootstrap4" />

<!-- Bootstrap CSS -->
<link href="css/bootstrap.min.css" rel="stylesheet">
<link
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
	rel="stylesheet">
<link href="css/tiny-slider.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>Furni</title>
</head>

<body>

	<!-- Start Header/Navigation -->
	<nav
		class="custom-navbar navbar navbar navbar-expand-md navbar-dark bg-dark"
		arial-label="Furni navigation bar" th:replace="~{index::navfragment}">
	</nav>
	<!-- End Header/Navigation -->

	<!-- Start Hero Section -->
	<div class="hero">
		<div class="container">
			<div class="row justify-content-between">
				<div class="col-lg-5">
					<div class="intro-excerpt">
						<h1>Cart</h1>
					</div>
				</div>
				<div class="col-lg-7"></div>
			</div>
		</div>
	</div>
	<!-- End Hero Section -->



	<div class="untree_co-section before-footer-section">
		<div class="container">
			<div class="row mb-5">
				<div class="site-blocks-table">
					<table class="table">
						<thead>
							<tr>
								<th class="product-thumbnail">Image</th>
								<th class="product-name">Product</th>
								<th class="product-price">Price</th>
								<th class="product-quantity">Quantity</th>
								<th class="product-total">Total</th>
								<th class="product-remove">Remove</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="cartitem : ${cartitems}">
								<td class="product-thumbnail"><img
									th:src="${cartitem.imageUrl}" alt="Image" class="img-fluid">
								</td>
								<td class="product-name">
									<h2 class="h5 text-black">
										<span th:text="${cartitem.imageName}"></span>
									</h2>
								</td>
								<td><span th:text="${cartitem.price}"></span></td>
								<td>
									<div
										class="input-group mb-3 d-flex align-items-center quantity-container"
										style="max-width: 120px;">
										<form method="post" th:action="@{/updateCart}">
											<input type="hidden" th:name="'cartId'"
												th:value="${cartitem.cartId}" /> 
												<input type="hidden"
												th:name="'imageUrl'" th:value="${cartitem.imageUrl}" />
												<input
												type="hidden" th:name="'imageName'"
												th:value="${cartitem.imageName}" /> 
												<input type="hidden"
												th:name="'price'" th:value="${cartitem.price}" /> 
												<input
												type="number" th:name="'quantity'"
												th:value="${cartitem.quantity}" min="1" required
												onchange="this.form.submit()">
										</form>
									</div>
								</td>
								<td><span th:text="${cartitem.getTotalAmount()}"></span></td>
								<td><a
									th:href="@{/delete/{cartId}(cartId=${cartitem.cartId})}"
									class="btn btn-black btn-sm">X</a></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<div class="row">
				<div class="col-md-6">
					<div class="row mb-5">
						<div class="col-md-6">
							<a th:href="@{/shop}"><button
									class="btn btn-outline-black btn-sm btn-block">Continue
									Shopping</button></a>
						</div>
					</div>
					<!-- <div class="row">
						<div class="col-md-12">
							<label class="text-black h4" for="coupon">Coupon</label>
							<p>Enter your coupon code if you have one.</p>
						</div>
						<div class="col-md-8 mb-3 mb-md-0">
							<input type="text" class="form-control py-3" id="coupon"
								placeholder="Coupon Code">
						</div>
						<div class="col-md-4">
							<button class="btn btn-black">Apply Coupon</button>
						</div>
					</div> -->
				</div>
				<div class="col-md-6 pl-5">
					<div class="row justify-content-end">
						<div class="col-md-7">
							<div class="row">
								<div class="col-md-12 text-right border-bottom mb-5">
									<h3 class="text-black h4 text-uppercase">Cart Totals</h3>
								</div>
							</div>
							<div class="row mb-5">
								<div class="col-md-6">
									<span class="text-black">Payable Amount</span>
								</div>
								<div class="col-md-6 text-right">
									<strong class="text-black"><span th:text="'INR'+' ' + ${totalAmount}"></span></strong>
								</div>
							</div>

							<div class="row">
								<div class="col-md-12">
									<a th:href="@{/checkout}"><button
											class="btn btn-black btn-lg py-3 btn-block" type="button">Proceed
											To Checkout</button></a>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Start Footer Section -->
	<footer class="footer-section" th:replace="~{index::footerfragment}">
	</footer>
	<!-- End Footer Section -->

	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/tiny-slider.js"></script>
	<script src="js/custom.js"></script>
</body>

</html>
